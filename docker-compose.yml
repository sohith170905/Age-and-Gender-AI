services:
  app:
    build: .
    image: agevision-ai:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      AGE_GENDER_MODEL: ${AGE_GENDER_MODEL:-agevision_onnx}
      AGE_GENDER_API_KEY: ${AGE_GENDER_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    build: .
    image: agevision-ai:local
    profiles: ["api"]
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGE_GENDER_MODEL: ${AGE_GENDER_MODEL:-agevision_onnx}
      AGE_GENDER_API_KEY: ${AGE_GENDER_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  app_data:
  app_logs:
